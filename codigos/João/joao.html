<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>produto</title>
   <link rel="stylesheet" href="joao.css">
</head>
<body>
  <form id="form-produto" onsubmit="lidarComSubmit(event)">
    <br/>
    <br/>
    <label for="nome">Nome:</label>
    <br/>
    <br/>
    <input type="text" id="nome" name="nome">
    <br/>
    <br/>
    <label for="preco">Preço:</label>
    <br/>
    <br/>
    <input type="number" id="preco" name="preco">
    <br/>
    <br/>
    <label for="codigo">Código:</label>
    <br/>
    <br/>
    <input type="text" id="codigo" name="codigo">
    <br/>

    <button id="botao-submit" type="submit">Enviar</button>
    <button id="botao-cancelar" type="button" hidden>Cancelar</button>
  </form>

  <h2>Produtos cadastrados</h2>
  <ul id="lista-produtos"></ul>

  <script src="joao.js"></script>
</body>
</html>
